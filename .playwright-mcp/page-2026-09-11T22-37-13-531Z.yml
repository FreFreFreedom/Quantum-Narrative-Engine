              - generic [ref=f2e145]: So I find myself becoming more and more interested in politics. But if we use our paradigm, I believe that politics become much more interesting and we can learn a lot, you know, with, you know, the cross-domain, you know, fractal, analogical reasoning. You know, if we apply this to politics, you know. So yeah, I think this idea of fractal politics becomes very interesting and I'd like to explore this with you. So give me a long answer and explore this, please. Thank you.
