                  - listitem [ref=f2e861]: Or, in a state, the bureaucratic suppression of difference breeds underground cultures, which become internal parasites, which flip to dominance—the same pattern as repressed trauma returning as compulsion or symptom in an individual psyche.
                - paragraph [ref=f2e862]: The world does not have, anywhere, an engine that lets you tie these layers together—not as metaphor, but as mutual implication, as a single phenomenon with echoes at every rung. The most honest map right now comes from poets, from theologians, sometimes from systems theorists—none of whom have built anything that lets the surgeon cut at the right place, the reconciler bring the pattern to consciousness, the policy be made whole by understanding where it splits the field.
                - paragraph [ref=f2e863]: "To build it would be to see every field as an experiment in metabolizing or re-exiling the same secret fracture. Today, the best we have are dull proxies: psychological assessment inventories, half-baked analogies in management theory (“the family is a microcosm of the state”), or the old pattern-stamping of psychoanalysis. The “at all rungs, at once” system is not just unbuilt; it hasn’t even been tried half-seriously, outside of scattered, poetic attempts."
                - paragraph [ref=f2e864]: "To name the bone beneath the tissue, to let one shape show itself as many is to let systems metabolize novelty and crisis, rather than defaulting to murder, exclusion, riot, or suppression. It would be having the instrument that knows, not just believes, that the border established by a country is the cell wall reified, is the emotional boundary enacted in a lover’s argument, is the immune system reinvented as law—a pattern, one pattern, dressed in a thousand skins. And with each new wound, to watch how it ricochets across the mesh: repression inside writes fracture outside, reconciliation inside remakes law."
