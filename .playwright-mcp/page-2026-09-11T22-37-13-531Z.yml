                  - text: "as two entries in the same dossier: the Troubles and the American addict's family as twin expressions of a people whose collective wound has become so dense it can only metabolize itself through the individual body — the hunger strike, the overdose, the silent collapse in a kitchen that nobody witnesses. It would let you see"
                  - emphasis [ref=f2e268]: Zero Dark Thirty
