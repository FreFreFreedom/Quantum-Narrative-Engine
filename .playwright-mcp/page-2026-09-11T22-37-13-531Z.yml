                - paragraph [ref=f2e265]:
                  - text: The narratives you are collecting are not just stories about justice. They are field notes from the deepest layer of a people's self-understanding — the place where law, trauma, race, and myth are not separate categories but one fabric, viewed at different magnifications. A fractal instrument would let you read that fabric as a single weave. It would show you
