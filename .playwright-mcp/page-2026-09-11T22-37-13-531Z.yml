                  - text: a civic structure's shadow not as a political opinion but as a geometric fact. The criminal justice system, read fractally, is not "unjust" in the way a policy critique would name — it is a system whose architecture of exclusion mirrors, at every scale, the psychic architecture of the society that built it. The scapegoat mechanism that drives a wrongful conviction is the same mechanism that drives a lynching, a puritanical sermon, a schoolyard expulsion, a national immigration policy. A fractal engine would not
