          - generic [ref=f2e102]: Solid lines are what contains what. Dashed lines are words in common, thicker for more. Ringed dots are the four things this conversation named; the rest are their nearest neighbours. Every dot is a door, and taking one puts it in your hands.
    - paragraph [ref=f2e104]: Cheapest and quietest. One panel, one thing at a time, nothing drawn twice. The cost is that what is in your hands — the thing that changes the meaning of everything you type — is invisible whenever you are looking at anything else.
  - generic [ref=f2e105]:
    - heading "What happens to the five tabs you have" [level=1] [ref=f2e106]
    - paragraph [ref=f2e107]: Right now the right side is Attached, Mind, Extraction, Passages and World look. The trouble is not that there are five — it is that four of them keep things under three different rules and none of them says so. Attached and World look belong to this conversation. Passages and Mind are global and follow you everywhere. And Extraction is blank unless a file is being read, which is almost always.
    - paragraph [ref=f2e108]: "So five becomes three. Hands is everything this conversation is about — the cards you attached, a line you kept, an idea you took, an entity you pinned. Graph is the picture. Offered is everything the app is proposing, which is world ideas and signals in one place instead of two. Extraction stops being a tab and becomes what it is: something a file does while you are reading it. Mind stops being a tab too — standing facts are not something you visit, they are something the app always knows, and it can say so in a line."
    - paragraph [ref=f2e109]: "Two things would have to be built for Hands to mean anything: an entity has to become attachable, which it is not today, and a kept line has to be attachable, which it also is not. Both are small."
    - paragraph [ref=f2e110]: "Everything shown is real: your own world ideas in their own words, your own signals, your own kept line."