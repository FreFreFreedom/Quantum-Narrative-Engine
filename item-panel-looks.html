<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Item panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Playfair+Display:wght@500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--c-bg:#0f1b1b;--c-bg-2:#122020;--c-surface:#16262a;--c-surface-2:#1b2e32;--c-surface-3:#1e3236;
--c-border:#274043;--c-border-2:#325054;--c-ink:#e4eee9;--c-ink-2:#cfdcd7;--c-ink-3:#a3b8b3;--c-ink-4:#86a09b;--c-ink-5:#5f7773;
--c-accent:#f0965a;--c-cast:#57c3b4}
*{box-sizing:border-box}
body{margin:0;background:#0b1414;color:var(--c-ink);font-family:'Inter',system-ui,sans-serif;padding:26px 18px 90px}
.wrap{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:26px}
.demo>h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink-5);margin:0 0 11px;font-weight:600}
.cov{background:#20343a center/cover no-repeat;border-radius:3px;flex:none;box-shadow:0 3px 12px rgba(0,0,0,.45)}
.chip{display:inline-block;font-size:10.5px;color:var(--c-ink-4);border:1px solid var(--c-border-2);border-radius:20px;padding:2px 9px}
.x{width:24px;height:24px;border-radius:50%;border:1px solid var(--c-border-2);background:transparent;color:var(--c-ink-4);font-size:11px;cursor:pointer;flex:none}
.acts{display:flex;gap:16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--c-border)}
.acts button{font:inherit;font-size:11.5px;letter-spacing:.02em;color:var(--c-ink-5);background:none;border:0;padding:0;cursor:pointer}
.acts button:hover{color:var(--c-cast)}
h6{margin:0}

/* ---------- A · Editorial ---------- */
.A{background:var(--c-surface);border:1px solid var(--c-border-2);border-radius:12px;padding:20px 22px 18px}
.A .head{display:flex;gap:18px;align-items:flex-start}
.A .cov{width:74px;height:110px}
.A h3{font-family:'Source Serif 4',serif;font-size:21px;font-weight:600;margin:0 0 3px;line-height:1.2}
.A .au{font-size:12.5px;color:var(--c-ink-4);margin-bottom:9px}
.A .chips{display:flex;gap:6px;flex-wrap:wrap}
.A h6{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--c-ink-5);margin:22px 0 8px;font-weight:600}
.A p{font-family:'Source Serif 4',serif;font-size:15px;line-height:1.66;color:var(--c-ink-2);margin:0}
.A .why{border-left:2px solid var(--c-cast);padding-left:14px}
.A .why p{color:var(--c-ink)}

/* ---------- B · Two columns ---------- */
.B{background:var(--c-surface);border:1px solid var(--c-border-2);border-radius:12px;padding:20px;display:grid;grid-template-columns:120px 1fr;gap:22px}
.B .cov{width:120px;height:180px}
.B .chips{margin-top:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.B h3{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;margin:0 0 2px;line-height:1.2}
.B .au{font-size:12.5px;color:var(--c-ink-4);margin-bottom:16px}
.B h6{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--c-ink-5);margin:0 0 7px;font-weight:600}
.B p{font-size:14px;line-height:1.62;color:var(--c-ink-2);margin:0 0 18px}
.B .why{background:rgba(87,195,180,.07);border-left:3px solid var(--c-cast);border-radius:0 8px 8px 0;padding:12px 14px}
.B .why p{margin:0;color:var(--c-ink)}

/* ---------- C · Jacket banner ---------- */
.C{background:var(--c-surface);border:1px solid var(--c-border-2);border-radius:12px;overflow:hidden}
.C .band{position:relative;padding:22px 22px 18px;display:flex;gap:18px;align-items:flex-end;
  background:linear-gradient(180deg,#24383d 0%,var(--c-surface) 100%)}
.C .cov{width:82px;height:122px;margin-bottom:-34px}
.C h3{font-family:'Literata',serif;font-size:19px;font-weight:600;margin:0 0 2px}
.C .au{font-size:12px;color:var(--c-ink-4)}
.C .body{padding:46px 22px 18px}
.C .chips{display:flex;gap:6px;margin:0 0 18px}
.C h6{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--c-ink-5);margin:0 0 7px;font-weight:600}
.C p{font-family:'Literata',serif;font-size:14px;line-height:1.7;color:var(--c-ink-2);margin:0 0 20px}
.C .why p{color:var(--c-ink)}

/* ---------- D · Quiet, no box ---------- */
.D{background:var(--c-bg);border:1px solid var(--c-border);border-radius:12px;padding:22px 24px}
.D .head{display:flex;gap:16px;align-items:flex-start;padding-bottom:16px;border-bottom:1px solid var(--c-border)}
.D .cov{width:56px;height:84px}
.D h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:.01em;margin:0;line-height:1.1}
.D .au{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--c-ink-4);font-style:italic}
.D .meta{font-size:11px;color:var(--c-ink-5);margin-top:8px;letter-spacing:.04em}
.D h6{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--c-ink-5);margin:20px 0 8px;font-weight:600}
.D p{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;color:var(--c-ink-2);margin:0}
.D .why p{color:var(--c-ink)}

/* ---------- E · Tabs ---------- */
.E{background:var(--c-surface);border:1px solid var(--c-border-2);border-radius:12px;padding:18px 20px}
.E .head{display:flex;gap:14px;align-items:center}
.E .cov{width:48px;height:72px}
.E h3{font-size:16px;font-weight:600;margin:0}
.E .au{font-size:12px;color:var(--c-ink-4)}
.E .tabs{display:flex;gap:20px;margin:18px 0 0;border-bottom:1px solid var(--c-border)}
.E .tabs span{font-size:11.5px;letter-spacing:.04em;color:var(--c-ink-5);padding-bottom:8px;cursor:pointer}
.E .tabs span.on{color:var(--c-cast);box-shadow:inset 0 -1px 0 var(--c-cast)}
.E p{font-size:14px;line-height:1.66;color:var(--c-ink-2);margin:16px 0 0}

/* ---------- F · Wide reading ---------- */
.F{background:var(--c-surface);border:1px solid var(--c-border-2);border-radius:12px;padding:24px 26px}
.F .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:4px}
.F h3{font-family:'Source Serif 4',serif;font-size:24px;font-weight:600;margin:0;line-height:1.15;max-width:78%}
.F .au{font-size:12.5px;color:var(--c-ink-4);margin-bottom:14px}
.F .strip{display:flex;gap:16px;align-items:center;padding:12px 0;border-top:1px solid var(--c-border);border-bottom:1px solid var(--c-border);font-size:11px;color:var(--c-ink-5);letter-spacing:.04em}
.F .strip .cov{width:32px;height:48px}
.F h6{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--c-ink-5);margin:20px 0 8px;font-weight:600}
.F p{font-family:'Source Serif 4',serif;font-size:15.5px;line-height:1.7;color:var(--c-ink-2);margin:0;max-width:62ch}
.F .why p{color:var(--c-ink);border-left:2px solid var(--c-cast);padding-left:14px}
</style></head><body><div class="wrap">
<script>
const IMG="https://books.google.com/books/content?id=zThPAQAAQBAJ&printsec=frontcover&img=1&zoom=3";
const T="Golden Gulag", A="Ruth Wilson Gilmore";
const WHAT="Since 1980, the number of people in U.S. prisons has increased more than 450%. Despite a crime rate that has been falling steadily for decades, California has led the way in this explosion, with what a state analyst called the biggest prison building project in the history of the world.";
const WHY="It gives you the exact blueprint for how a state expands its carceral capacity — land, labour, finance and surplus population arriving at the same table. Reach into it when you need the economic machinery under a story about punishment.";
const R='<button class="x">✕</button>';
const ACTS='<div class="acts"><button>Attach</button><button>Edit</button><button>Remove</button></div>';
const D=document;
function put(h){D.write(h)}
put(`<section class="demo"><h2>A · Editorial</h2><div class="A">
<div class="head"><span class="cov" style="background-image:url(${IMG})"></span><div style="flex:1">
<h3>${T}</h3><div class="au">${A}</div><div class="chips"><span class="chip">413 pages</span><span class="chip">2007</span><span class="chip">named in 3 talks</span></div></div>${R}</div>
<h6>What it is</h6><p>${WHAT}</p><h6>Why it is here</h6><div class="why"><p>${WHY}</p></div>${ACTS}</div></section>`);

put(`<section class="demo"><h2>B · Two columns</h2><div class="B">
<div><span class="cov" style="background-image:url(${IMG})"></span><div class="chips"><span class="chip">413 pages</span><span class="chip">2007</span><span class="chip">3 talks</span></div></div>
<div><div style="display:flex;justify-content:space-between"><div><h3>${T}</h3><div class="au">${A}</div></div>${R}</div>
<h6>What it is</h6><p>${WHAT}</p><h6>Why it is here</h6><div class="why"><p>${WHY}</p></div>${ACTS}</div></div></section>`);

put(`<section class="demo"><h2>C · Jacket banner</h2><div class="C">
<div class="band"><span class="cov" style="background-image:url(${IMG})"></span><div style="flex:1"><h3>${T}</h3><div class="au">${A}</div></div>${R}</div>
<div class="body"><div class="chips"><span class="chip">413 pages</span><span class="chip">2007</span><span class="chip">named in 3 talks</span></div>
<h6>What it is</h6><p>${WHAT}</p><h6>Why it is here</h6><div class="why"><p>${WHY}</p></div>${ACTS}</div></div></section>`);

put(`<section class="demo"><h2>D · Quiet, no box</h2><div class="D">
<div class="head"><span class="cov" style="background-image:url(${IMG})"></span><div style="flex:1"><h3>${T}</h3><div class="au">${A}</div><div class="meta">413 PAGES · 2007 · NAMED IN 3 TALKS</div></div>${R}</div>
<h6>What it is</h6><p>${WHAT}</p><h6>Why it is here</h6><div class="why"><p>${WHY}</p></div>${ACTS}</div></section>`);

put(`<section class="demo"><h2>E · Tabs</h2><div class="E">
<div class="head"><span class="cov" style="background-image:url(${IMG})"></span><div style="flex:1"><h3>${T}</h3><div class="au">${A} · 2007 · 413 pages</div></div>${R}</div>
<div class="tabs"><span class="on">What it is</span><span>Why it is here</span><span>Passages · 3</span></div>
<p>${WHAT}</p>${ACTS}</div></section>`);

put(`<section class="demo"><h2>F · Wide reading</h2><div class="F">
<div class="head"><h3>${T}</h3>${R}</div><div class="au">${A}</div>
<div class="strip"><span class="cov" style="background-image:url(${IMG})"></span><span>413 PAGES</span><span>2007</span><span>NAMED IN 3 TALKS</span></div>
<h6>What it is</h6><p>${WHAT}</p><h6>Why it is here</h6><div class="why"><p>${WHY}</p></div>${ACTS}</div></section>`);
</script>
</div></body></html>
