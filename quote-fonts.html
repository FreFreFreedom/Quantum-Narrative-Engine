<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Quote fonts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Marcellus&family=Gilda+Display&family=Italiana&family=Cardo:ital@0;1&family=Vollkorn:ital,wght@0,400;1,400&family=Petrona:ital,wght@0,400;1,400&family=Gentium+Book+Plus:ital@0;1&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Spectral:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--c-bg:#0f1b1b;--c-bg-2:#122020;--c-border:#274043;--c-ink:#e4eee9;--c-ink-2:#cfdcd7;--c-ink-5:#5f7773;--c-cast:#57c3b4}
*{box-sizing:border-box}
body{margin:0;background:var(--c-bg-2);color:var(--c-ink);font-family:'Inter',system-ui,sans-serif;padding:28px 20px 80px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(370px,1fr));gap:24px}
.demo{background:var(--c-bg);border:1px solid var(--c-border);border-radius:12px;padding:15px 16px 18px}
.demo>h2{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--c-ink-5);margin:0 0 13px;font-weight:600}
.q{background:rgba(87,195,180,.07);border-left:3px solid var(--c-cast);border-radius:0 8px 8px 0;padding:15px 17px 12px;margin:0 0 12px}
.q p{margin:0;color:var(--c-ink-2)}
.q .row{display:flex;align-items:center;gap:14px;margin-top:10px}
.att{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--c-ink-5);background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:color .15s}
.att svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round}
.att:hover{color:var(--c-cast)}
.date{font-family:'Inter',sans-serif;font-size:11px;color:var(--c-ink-5)}

.f1 p{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.5;font-weight:400}
.f2 p{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.5;font-style:italic}
.f3 p{font-family:'EB Garamond',serif;font-size:17px;line-height:1.55;font-style:italic}
.f4 p{font-family:'Playfair Display',serif;font-size:15.5px;line-height:1.6}
.f5 p{font-family:'Playfair Display',serif;font-size:15.5px;line-height:1.6;font-style:italic}
.f6 p{font-family:'Marcellus',serif;font-size:15.5px;line-height:1.62}
.f7 p{font-family:'Gilda Display',serif;font-size:15px;line-height:1.65}
.f8 p{font-family:'Cardo',serif;font-size:16px;line-height:1.6;font-style:italic}
.f9 p{font-family:'Vollkorn',serif;font-size:15.5px;line-height:1.6;font-style:italic}
.f10 p{font-family:'Bodoni Moda',serif;font-size:15px;line-height:1.65}
.f11 p{font-family:'Petrona',serif;font-size:16px;line-height:1.6;font-style:italic}
.f12 p{font-family:'Spectral',serif;font-weight:300;font-size:15.5px;line-height:1.68;font-style:italic}
.f13 p{font-family:'Gentium Book Plus',serif;font-size:16px;line-height:1.6;font-style:italic}
.f14 p{font-family:'Italiana',serif;font-size:17px;line-height:1.6;letter-spacing:.02em}
</style></head><body><div class="wrap">
<script>
const QUOTES=[
 "the play asks: what happens to a people when the civic structure meant to hold them together becomes the instrument of their isolation?",
 "The prison system emerges as an administrative machine designed to absorb the human debris of its own economic choices, harvesting social distress and turning it into institutional permanence."
];
const NAMES=["1 · Cormorant Garamond","2 · Cormorant italic","3 · EB Garamond italic","4 · Playfair Display","5 · Playfair italic","6 · Marcellus","7 · Gilda Display","8 · Cardo italic","9 · Vollkorn italic","10 · Bodoni Moda","11 · Petrona italic","12 · Spectral light italic","13 · Gentium italic","14 · Italiana"];
const CLIP='<svg viewBox="0 0 24 24"><path d="M21 11l-9 9a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8-8"/></svg>';
document.write(NAMES.map((n,i)=>
 `<section class="demo f${i+1}"><h2>${n}</h2>`+
 QUOTES.map((q,j)=>`<div class="q"><p>${q}</p><div class="row"><button class="att">${CLIP}Attach</button><span class="date">Sep 1${4-j}</span></div></div>`).join('')+
 `</section>`).join(''));
</script>
</div></body></html>
