name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: queue-server/package-lock.json
      - run: cd queue-server && npm ci
      - run: cd queue-server && npm run typecheck

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fmcns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: queue-server/package-lock.json
      - run: cd queue-server && npm ci
      - run: cd queue-server && npm run db:schema
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/fmcns_test
      - run: cd queue-server && npm run test
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/fmcns_test
          JWT_SECRET: test-secret-key-for-ci
          ADMIN_PASSWORD: test-password
          ANTHROPIC_API_KEY: dummy
          CLAUDE_BIN: claude
          CHAT_MODEL: claude-sonnet-4-5
          CONVO_CHAT_MODEL: claude-sonnet-4-5
          CONVO_PLAN_MODEL: claude-sonnet-4-5
          TEXT_BACKEND: cli
          GITHUB_TOKEN: dummy
          TMDB_API_KEY: dummy
          QUEUE_URL: http://localhost:3000
          RUNNER_REPO: /tmp
          RUNNER_ID: ci-runner
          FIRST_OUTPUT_MS: "90000"
          SILENCE_MS: "300000"
          ATTEMPT_CAP_MS: "1800000"
          SNAPSHOT_MS: "30000"
          PROGRESS_MS: "15000"
          RAILWAY_VOLUME_MOUNT_PATH: /tmp
          DATA_DIR: /tmp/data
          AGENT_CWD: /tmp
          WORKTREE_ROOT: /tmp/worktrees
          GIT_OPS_DISABLED: "1"
          MAIN_REPO: /tmp
          PORT: "3000"
          PREGEN_ENABLED: "0"
          WARMUP_DISABLED: "1"
          RUN_QUEUE_SELFTEST: "0"
          EXECUTION_MODE: local
          MAX_PARALLEL_QUESTIONS: "1"
          MAX_CONCURRENT_WRITERS: "1"
          MIN_FREE_MEMORY_MB: "300"
          APP_URL: ""
          NOTIFY_WEBHOOK_URL: ""
          CLAUDE_CODE_OAUTH_TOKEN: dummy
          OPENCODE_BIN: opencode

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: queue-server/package-lock.json
      - run: cd queue-server && npm ci
      - run: cd queue-server && npx playwright install --with-deps chromium
      - run: cd queue-server && npm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BIN: ${{ secrets.CLAUDE_BIN }}
          CHAT_MODEL: ${{ secrets.CHAT_MODEL }}
          CONVO_CHAT_MODEL: ${{ secrets.CONVO_CHAT_MODEL }}
          CONVO_PLAN_MODEL: ${{ secrets.CONVO_PLAN_MODEL }}
          TEXT_BACKEND: ${{ secrets.TEXT_BACKEND }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          QUEUE_URL: ${{ secrets.QUEUE_URL }}
          RUNNER_REPO: ${{ secrets.RUNNER_REPO }}
          RUNNER_ID: ${{ secrets.RUNNER_ID }}
          RAILWAY_VOLUME_MOUNT_PATH: ${{ secrets.RAILWAY_VOLUME_MOUNT_PATH }}
          DATA_DIR: ${{ secrets.DATA_DIR }}
          AGENT_CWD: ${{ secrets.AGENT_CWD }}
          WORKTREE_ROOT: ${{ secrets.WORKTREE_ROOT }}
          MAIN_REPO: ${{ secrets.MAIN_REPO }}
          PORT: ${{ secrets.PORT }}
          PREGEN_ENABLED: ${{ secrets.PREGEN_ENABLED }}
          WARMUP_DISABLED: ${{ secrets.WARMUP_DISABLED }}
          RUN_QUEUE_SELFTEST: ${{ secrets.RUN_QUEUE_SELFTEST }}
          EXECUTION_MODE: ${{ secrets.EXECUTION_MODE }}
          MAX_PARALLEL_QUESTIONS: ${{ secrets.MAX_PARALLEL_QUESTIONS }}
          MAX_CONCURRENT_WRITERS: ${{ secrets.MAX_CONCURRENT_WRITERS }}
          MIN_FREE_MEMORY_MB: ${{ secrets.MIN_FREE_MEMORY_MB }}
          APP_URL: ${{ secrets.APP_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENCODE_BIN: ${{ secrets.OPENCODE_BIN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [typecheck, test, e2e]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - uses: railway/cli@v1
        with:
          command: up --service staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [typecheck, test, e2e]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: railway/cli@v1
        with:
          command: up --service production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}